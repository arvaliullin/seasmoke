[package]
name = "seasmoke"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
